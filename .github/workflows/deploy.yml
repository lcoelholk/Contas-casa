# Publica o app no GitHub Pages a cada push na main.
# Link final: https://lcoelholk.github.io/Contas-casa/
#
# Precisa (uma vez só, em Settings do repositório):
#   - Secrets and variables → Actions: VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY
#   - Pages → Source: GitHub Actions

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Só uma publicação por vez; a mais nova cancela a anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Testar e montar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Conferir as chaves do Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltam os Secrets VITE_SUPABASE_URL e/ou VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Testes do app
        run: npm test

      - name: Testes do banco
        run: npm run test:banco

      - name: Montar o app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
